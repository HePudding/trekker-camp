name: 需求记录
description: 记录团队已确认的营地需求
labels: ["✨Feature"]
body:
  - type: textarea
    attributes:
      label: 需求与使用场景
      description: 描述旅人在营地遇到的问题和期望的行为。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 实现范围与验收条件
      description: 记录已确认的范围和完成标准。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 相关任务与依赖
