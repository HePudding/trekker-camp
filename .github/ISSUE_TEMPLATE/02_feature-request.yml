name: ✨ 功能请求
description: 为项目提出建议
labels: ["✨Feature"]

body:
  - type: textarea
    attributes:
      label: 概述
      description: 请描述你的建议
    validations:
      required: true
  - type: textarea
    attributes:
      label: 目的
      description: 请说明该功能解决的具体问题或需求，以及受益的用户群体。
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: 你愿意自行实现这个功能吗？
      options:
        - label: 是，我会自行实现并提交 Pull Request
