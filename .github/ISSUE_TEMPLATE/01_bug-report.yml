name: 缺陷记录
description: 记录旅人营地本站或团队开发环境中的问题
labels: ["⚠️bug?"]
body:
  - type: markdown
    attributes:
      value: |
        用于团队跟踪营地问题，请先检查已有记录。安全问题按仓库 SECURITY.md 私下联系维护团队，不在此处披露细节。
  - type: textarea
    attributes:
      label: 问题概述
      description: 描述受影响的页面、功能和使用场景。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 预期与实际行为
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
      description: 附必要的脱敏日志或截图，不包含账号令牌和用户隐私。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 环境
      description: 填写本站或本地测试环境、代码版本或提交号、设备与浏览器版本；后端问题补充相关运行环境。
