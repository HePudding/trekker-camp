name: API report (misskey.js)

on:
  push:
    paths:
      - apps/misskey/packages/misskey-js/**
      - .github/workflows/api-misskey-js.yml
  pull_request:
    branches-ignore:
      - master
    paths:
      - apps/misskey/packages/misskey-js/**
      - .github/workflows/api-misskey-js.yml
jobs:
  report:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Build
        run: pnpm --filter misskey-js build

      - name: Check files
        run: ls apps/misskey/packages/misskey-js/built

      - name: API report
        run: pnpm --filter misskey-js api-prod

      - name: Show report
        if: always()
        run: cat apps/misskey/packages/misskey-js/temp/misskey-js.api.md
