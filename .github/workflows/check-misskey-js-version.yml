name: Check Misskey JS version

on:
  push:
    branches: [ develop ]
    paths:
      - apps/misskey/packages/misskey-js/package.json
      - apps/misskey/package.json
      - .github/workflows/check-misskey-js-version.yml
  pull_request:
    branches: [ develop ]
    paths:
      - apps/misskey/packages/misskey-js/package.json
      - package.json
      - .github/workflows/check-misskey-js-version.yml
jobs:
  check-version:
    # ルートの package.json と apps/misskey/packages/misskey-js/package.json のバージョンが一致しているかを確認する
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Check version
        run: |
          if [ "$(jq -r '.version' apps/misskey/package.json)" != "$(jq -r '.version' apps/misskey/packages/misskey-js/package.json)" ]; then
            echo "Version mismatch!"
            exit 1
          fi
